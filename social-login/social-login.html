<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./social-login.js"></script>
    <link rel="stylesheet" href="./social-login.css">
</head>

<body>
    <main>
        <h1>
            Already Working Together?
        </h1>
        <p>
            login into your account and connect with your teammates.
        </p>
        <div class="icon-wrapper">
            <input type="email" id="email" placeholder="your_email@address.com">
            <button class="login-button"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-narrow-right">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M5 12l14 0" />
                    <path d="M15 16l4 -4" />
                    <path d="M15 8l4 4" />
                </svg></button>
        </div>
        <div class="image-wrapper">
            <img src="https://i.pravatar.cc/150?img=1" alt="image-1">
            <img src="https://i.pravatar.cc/150?img=2" alt="image-2">
            <img src="https://i.pravatar.cc/150?img=3" alt="image-3">
            <img src="https://i.pravatar.cc/150?img=4" alt="image-4">
            <img src="https://i.pravatar.cc/150?img=5" alt="image-5">
        </div>
    </main>
</body>

</html>
